name: Standalone artifacts

on:
  workflow_dispatch:
    inputs:
      qualified_release_tag:
        description: Draft release containing the complete locally qualified artifact set (optional)
        type: string
        default: ""
  workflow_call:
    inputs:
      qualified_release_tag:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  native:
    # Explicit diagnostic fallback only; normal release qualification runs locally.
    if: inputs.qualified_release_tag == ''
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build and exercise the native release archive
        shell: bash
        run: |
          actual=$(bun -p 'process.platform + "-" + process.arch')
          test "$actual" = '${{ matrix.target }}'
          if ! test -f .gitdocket-source.json; then
            public_source=$(mktemp -d)
            git -C "$public_source" init -q
            bun scripts/export-public.ts --source "$GITHUB_SHA" --destination "$public_source"
            cd "$public_source"
            bun install --frozen-lockfile
          fi
          bun scripts/standalone-release.ts build --output "$GITHUB_WORKSPACE/release/standalone"
      - uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ github.sha }}-${{ matrix.target }}
          path: release/standalone/*
          if-no-files-found: error
          retention-days: 30

  qualified-assets:
    if: inputs.qualified_release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the reviewed local qualification set for read-only preflight verification
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RELEASE_TAG: ${{ inputs.qualified_release_tag }}
        run: |
          mkdir -p release/standalone
          gh release view "$QUALIFIED_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true
          gh release download "$QUALIFIED_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release/standalone
      - uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ github.sha }}-qualified-local
          path: release/standalone/*
          if-no-files-found: error
          retention-days: 30
