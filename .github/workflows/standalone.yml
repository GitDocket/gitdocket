name: Standalone artifacts

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_release_tag:
        description: Draft release containing locally qualified macOS assets (optional)
        type: string
        default: ""
  workflow_call:
    inputs:
      macos_release_tag:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  native:
    # Public branch/PR checks use ci.yml; release builds require a qualified draft.
    if: github.repository != 'GitDocket/gitdocket' || github.event_name == 'workflow_dispatch' || inputs.macos_release_tag != ''
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build and exercise the native release archive
        shell: bash
        run: |
          actual=$(bun -p 'process.platform + "-" + process.arch')
          test "$actual" = '${{ matrix.target }}'
          if ! test -f .gitdocket-source.json; then
            public_source=$(mktemp -d)
            git -C "$public_source" init -q
            bun scripts/export-public.ts --source "$GITHUB_SHA" --destination "$public_source"
            cd "$public_source"
            bun install --frozen-lockfile
          fi
          bun scripts/standalone-release.ts build --output "$GITHUB_WORKSPACE/release/standalone"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ github.sha }}-${{ matrix.target }}
          path: release/standalone/*
          if-no-files-found: error
          retention-days: 30

  macos-assets:
    if: inputs.macos_release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub hides draft releases from tokens without push access.
    permissions:
      contents: write
    steps:
      - name: Fetch locally qualified macOS assets from the reviewed draft
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_RELEASE_TAG: ${{ inputs.macos_release_tag }}
        run: |
          mkdir -p release/standalone
          gh release view "$MACOS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true
          gh release download "$MACOS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*darwin*' --dir release/standalone
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ github.sha }}-macos-local
          path: release/standalone/*
          if-no-files-found: error
          retention-days: 30

  npm:
    if: inputs.macos_release_tag != ''
    needs: [native, macos-assets]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            node: "22"
          - os: ubuntu-24.04-arm
            target: linux-arm64
            node: "22"
          - os: ubuntu-24.04
            target: linux-x64
            node: "24"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global npm@11.17.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          pattern: standalone-${{ github.sha }}-*
          path: release/standalone
          merge-multiple: true
      - name: Qualify exact npm packages without Bun on product PATH
        shell: bash
        run: |
          if ! test -f .gitdocket-source.json; then
            public_source=$(mktemp -d)
            git -C "$public_source" init -q
            bun scripts/export-public.ts --source "$GITHUB_SHA" --destination "$public_source"
            cp -R release/standalone "$public_source/release/standalone"
            cd "$public_source"
            bun install --frozen-lockfile
          fi
          bun scripts/macos-qualification.ts --artifacts release/standalone
          bun run release:pack
          bun scripts/npm-qualify.ts --output "$GITHUB_WORKSPACE/release/npm-${{ matrix.target }}-node${{ matrix.node }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ github.sha }}-${{ matrix.target }}-node${{ matrix.node }}
          path: release/npm-*.json
          if-no-files-found: error
          retention-days: 30

  homebrew:
    if: inputs.macos_release_tag != ''
    needs: [native, macos-assets]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ github.token }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --global npm@11.17.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          pattern: standalone-${{ github.sha }}-*
          path: release/standalone
          merge-multiple: true
      - name: Qualify formula lifecycle and channel migration
        shell: bash
        run: |
          if ! test -f .gitdocket-source.json; then
            public_source=$(mktemp -d)
            git -C "$public_source" init -q
            bun scripts/export-public.ts --source "$GITHUB_SHA" --destination "$public_source"
            cp -R release/standalone "$public_source/release/standalone"
            cd "$public_source"
            bun install --frozen-lockfile
          fi
          bun scripts/macos-qualification.ts --artifacts release/standalone
          bun scripts/homebrew-qualify.ts --output "$GITHUB_WORKSPACE/release/homebrew-${{ matrix.target }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-${{ github.sha }}-${{ matrix.target }}
          path: release/homebrew-*.json
          if-no-files-found: error
          retention-days: 30
