name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Bun 1.4.2 / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install --global npm@11.20.0
      - run: npm --version
      - run: bun --version
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bunx tsc --noEmit
      - name: Site preflight regression checks
        run: python3 scripts/site-preflight-test.py
      - name: Check site sources against declared published MCP baseline
        run: |
          version=$(python3 -c 'import json; print(json.load(open("site/docs/mcp/provenance.json"))["executableVersion"])')
          python3 scripts/site-preflight.py --version "$version" --report /tmp/site-preflight.json
      - run: bun test --timeout 30000
      - name: Lint the public example bundle
        run: bun ../../packages/cli/src/index.ts lint
        working-directory: examples/basic
      - name: Check the public example index
        run: bun ../../packages/cli/src/index.ts index --check
        working-directory: examples/basic
      - name: Lint the private source bundle when present
        if: ${{ hashFiles('docket.yaml') != '' }}
        run: bun run docket lint
      - name: Check the private source index when present
        if: ${{ hashFiles('docket.yaml') != '' }}
        run: bun run docket index --check
      - name: Detect dependency changes
        id: dependency-changes
        if: ${{ runner.os == 'Linux' && github.event_name == 'pull_request' }}
        run: >-
          bun scripts/ci-dependency-changes.ts
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Audit dependencies
        if: ${{ runner.os == 'Linux' && (github.event_name == 'push' || steps.dependency-changes.outputs.changed == 'true') }}
        run: bun run audit:dependencies
