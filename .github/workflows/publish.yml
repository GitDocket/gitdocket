name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'GitDocket/gitdocket'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - run: bun --version
      - run: npm --version
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bunx tsc --noEmit
      - run: bun test
      - name: Lint the public example bundle
        run: bun ../../packages/cli/src/index.ts lint
        working-directory: examples/basic
      - name: Check the public example index
        run: bun ../../packages/cli/src/index.ts index --check
        working-directory: examples/basic
      - name: Audit dependencies
        run: bun run audit:dependencies
      - run: bun run release:pack
      - run: bun run release:publish
